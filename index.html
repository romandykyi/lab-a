<!DOCTYPE html>
<html lang="en">
    <head>
        <title>TODO List</title>
        <script src="todo.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="todoMain">
            <input id="searchField" type="search" placeholder="Search..." />
            <form id="todoForm">
                <div id="todoList">
                    <div class="task">
                        <input type="checkbox" id="task1Checkbox">
                        <label for="task1Checkbox">Task 1</label>
                        <span class="date">10/25/2025</span>
                        <button class="iconBtn" type="button" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z"/></svg>
                        </button>
                    </div>
                    <div class="task editMode">
                        <input type="text" id="task2Text" class="taskInput">
                        <input type="date" id="task2Date" class="taskDateInput">
                        <button class="iconBtn" type="button" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="bottomPanel">
                    <input id="taskText" type="text" placeholder="Add your task here..." />
                    <input id="taskDate" type="date" />
                    <button id="submitButton" type="submit">Add</button>
                </div>
            </form>
        </div>
    </body>
</html>
