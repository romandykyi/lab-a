<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Puzzle Leaflet</title>
    
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="leaflet-1.7.1/leaflet.css" />
    
    <script src="leaflet-1.7.1/leaflet-src.js"></script>
    <script src="leaflet-1.7.1/leaflet-providers.js"></script>
    <script src="leaflet-1.7.1/leaflet-image.js"></script>

    <script src="script.js" defer></script>
</head>
<body>
    <div class="grid-container">
        <div id="map" class="mapBlock"></div>
        <div class="mapBlock">
            <canvas id="rasterMap"></canvas>
            <div class="overlay">
                <button id="getLocation">Moja lokalizacja</button>
                <button id="saveButton">Pobierz mapę</button>
                <p>
                    <b>Latitude:</b> <span id="latitude"></span>
                </p>
                <p>
                    <b>Longitude:</b> <span id="longitude"></span>
                </p>
            </div>
        </div>
        <div class="mapBlock puzzleContainer" id="leftContainer"></div>
        <div class="mapBlock puzzleContainer" id="rightContainer"></div>
    </div>

</body>
</html>
